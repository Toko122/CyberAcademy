name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/html
            git fetch origin
            git reset --hard origin/main
            npm ci --legacy-peer-deps

            # Never build on top of files that the running Next.js process is serving.
            # Keep rollback output outside the source tree so Tailwind cannot scan it.
            backup_dir="/var/www/.academy-next-previous"
            pm2 stop academy || true
            rm -rf .next-previous "$backup_dir"
            if [ -d .next ]; then
              mv .next "$backup_dir"
            fi

            if NODE_ENV=production npm run build; then
              # Recreate the process so an old `next dev` PM2 command cannot survive.
              pm2 delete academy || true
              NODE_ENV=production pm2 start npm --name academy -- start
              pm2 save
              rm -rf "$backup_dir"
            else
              rm -rf .next
              if [ -d "$backup_dir" ]; then
                mv "$backup_dir" .next
              fi
              pm2 restart academy --update-env || true
              exit 1
            fi

